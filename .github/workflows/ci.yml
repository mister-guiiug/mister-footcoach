name: CI

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install, format check, lint, test, build
        env:
          VITE_PUBLIC_SITE_ORIGIN: https://example.github.io
        run: npm ci && npm run format:check && npm run lint && npm run test && npm run build
