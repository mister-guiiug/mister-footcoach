# CI déléguée au reusable workflow famille (dev-pwa-config).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-ci.yml@v6
    # PAS de `secrets: inherit` : ce workflow n'en déclare aucun, et
    # `GITHUB_TOKEN` lui est fourni d'office. Hériter enverrait TOUS les
    # secrets du dépôt à un workflow qui n'en demande pas un seul.
    with:
      run-doctor: true # la checklist du parc, lue sur le dépôt et sur dist/ (AMELIORATIONS.md, T2)
      # `--strict` : une dette suffit désormais à faire échouer le job. Relevé
      # du 19/09/2026 : les dix-huit dépôts qui lancent le docteur étaient tous
      # à zéro défaut ET zéro dette, et AUCUN en mode strict — le docteur
      # parlait, rien ne l'écoutait. Gratuit aujourd'hui, il interdit la
      # prochaine régression.
      doctor-strict: true
      # Les seuils de `vitest.config.ts` ne sont VÉRIFIÉS que si la CI
      # joue `--coverage` : sans cette entrée Vitest ne mesure rien,
      # donc ne compare rien, et le job sort vert. Relevé du 13/09/2026 :
      # six dépôts déclaraient des seuils, UN SEUL les jouait.
      run-coverage: true
      # La suite Playwright existait et ne tournait nulle part. Pas de
      # `e2e-grep` ici : le défaut du réutilisable vaut `@critical|@a11y`, et
      # notre unique spec est taguée `@a11y`. Un filtre écrit à la main aurait
      # pu l'écarter en silence — Playwright rend « No tests found » avec un
      # code 0.
      run-e2e: true
