# CI déléguée au reusable workflow famille (dev-pwa-config).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-ci.yml@v4
    # PAS de `secrets: inherit` : ce workflow n'en déclare aucun, et
    # `GITHUB_TOKEN` lui est fourni d'office. Hériter enverrait TOUS les
    # secrets du dépôt à un workflow qui n'en demande pas un seul.
    with:
      run-doctor: true # la checklist du parc, lue sur le dépôt et sur dist/ (AMELIORATIONS.md, T2)
      # La suite Playwright existait et ne tournait nulle part. Pas de
      # `e2e-grep` ici : le défaut du réutilisable vaut `@critical|@a11y`, et
      # notre unique spec est taguée `@a11y`. Un filtre écrit à la main aurait
      # pu l'écarter en silence — Playwright rend « No tests found » avec un
      # code 0.
      run-e2e: true
